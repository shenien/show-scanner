name: Daily Show Scan

on:
  schedule:
    # 14:17 UTC ≈ 7:17am PDT / 6:17am PST. GitHub Actions cron doesn't shift
    # for daylight saving, so this drifts an hour twice a year — fine for a
    # "check every morning" job. Deliberately off the hour: GitHub's own docs
    # warn that schedules pinned to :00 queue behind every other repo's
    # top-of-the-hour cron and can be delayed or dropped under load.
    - cron: "17 14 * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run scan
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}

      - name: Commit updated show data
        run: |
          git config user.name "show-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/shows.json
          git diff --staged --quiet || git commit -m "Daily scan: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
